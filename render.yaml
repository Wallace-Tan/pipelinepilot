services:
  - type: web
    name: pipelinepilot-api
    runtime: python
    buildCommand: python -m pip install uv && curl -LsS https://ai.snowflake.com/static/cc-scripts/install.sh | sh && cd backend && uv sync --frozen --no-dev
    startCommand: bash scripts/render-start.sh
    healthCheckPath: /health
    envVars:
      - key: PIPELINEPILOT_MODE
        value: fixture
      - key: PIPELINEPILOT_DATABASE_PATH
        value: /tmp/pipelinepilot.sqlite3
      - key: PIPELINEPILOT_CORS_ORIGINS
        value: https://pipelinepilot.vercel.app
      - key: PIPELINEPILOT_COCO_ENABLED
        value: "false"
      - key: PIPELINEPILOT_COCO_COMMAND
        value: cortex
      - key: PIPELINEPILOT_COCO_CONNECTION
        value: pipelinepilot
      - key: PIPELINEPILOT_COCO_TIMEOUT_SECONDS
        value: "90"
